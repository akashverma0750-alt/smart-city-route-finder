# Server Configuration
# Dynamically binds to PORT environment variable provided by Render/Cloud hosts with default 8080
server.port=${PORT:8080}
server.address=0.0.0.0

# Application Name
spring.application.name=smart-city-route-finder-backend

# CORS Configuration - Comma-separated list of allowed origins
# In production on Render/Netlify, set CORS_ALLOWED_ORIGINS to the deployed frontend domain (e.g. https://your-site.netlify.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Logging
logging.level.com.smartcity.routefinder=INFO
logging.level.org.springframework.web=INFO

